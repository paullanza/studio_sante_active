# French copy of devise.en.yml. The app sends no email, so the confirmation,
# password reset and unlock messages are here only for completeness.
fr:
  devise:
    confirmations:
      confirmed: "Votre adresse courriel est confirmée."
      send_instructions: "Vous recevrez dans quelques minutes un courriel expliquant comment confirmer votre adresse."
      send_paranoid_instructions: "Si votre adresse courriel est dans notre base, vous recevrez dans quelques minutes un courriel expliquant comment la confirmer."
    failure:
      already_authenticated: "Vous êtes déjà connecté·e."
      inactive: "Votre compte est désactivé. Contactez un·e gestionnaire ou un·e admin."
      invalid: "Courriel ou mot de passe invalide."
      locked: "Votre compte est verrouillé."
      last_attempt: "Il vous reste une tentative avant le verrouillage de votre compte."
      not_found_in_database: "Courriel ou mot de passe invalide."
      timeout: "Votre session a expiré. Connectez-vous de nouveau pour continuer."
      unauthenticated: "Connectez-vous pour continuer."
      unconfirmed: "Vous devez confirmer votre adresse courriel pour continuer."
    mailer:
      confirmation_instructions:
        subject: "Instructions de confirmation"
      reset_password_instructions:
        subject: "Instructions pour changer le mot de passe"
      unlock_instructions:
        subject: "Instructions de déverrouillage"
      email_changed:
        subject: "Courriel modifié"
      password_change:
        subject: "Mot de passe modifié"
    omniauth_callbacks:
      failure: "Impossible de vous authentifier avec %{kind} : « %{reason} »."
      success: "Authentification réussie avec %{kind}."
    passwords:
      no_token: "Cette page n'est accessible qu'à partir d'un courriel de changement de mot de passe. Si c'est le cas, vérifiez que vous avez utilisé l'adresse complète."
      send_instructions: "Vous recevrez dans quelques minutes un courriel expliquant comment changer votre mot de passe."
      send_paranoid_instructions: "Si votre adresse courriel est dans notre base, vous recevrez dans quelques minutes un lien pour changer votre mot de passe."
      updated: "Votre mot de passe est modifié. Vous êtes connecté·e."
      updated_not_active: "Votre mot de passe est modifié."
    registrations:
      destroyed: "Votre compte est supprimé."
      signed_up: "Bienvenue! Votre compte est créé."
      signed_up_but_inactive: "Votre compte est créé, mais il n'est pas encore activé : vous ne pouvez pas encore vous connecter."
      signed_up_but_locked: "Votre compte est créé, mais il est verrouillé : vous ne pouvez pas vous connecter."
      signed_up_but_unconfirmed: "Un courriel de confirmation vous a été envoyé. Suivez le lien qu'il contient pour activer votre compte."
      update_needs_confirmation: "Votre compte est mis à jour, mais nous devons vérifier votre nouvelle adresse courriel. Suivez le lien de confirmation reçu par courriel."
      updated: "Votre compte est mis à jour."
      updated_but_not_signed_in: "Votre compte est mis à jour. Comme votre mot de passe a changé, connectez-vous de nouveau."
    sessions:
      signed_in: "Connexion réussie."
      signed_out: "Déconnexion réussie."
      already_signed_out: "Déconnexion réussie."
    unlocks:
      send_instructions: "Vous recevrez dans quelques minutes un courriel expliquant comment déverrouiller votre compte."
      send_paranoid_instructions: "Si votre compte existe, vous recevrez dans quelques minutes un courriel expliquant comment le déverrouiller."
      unlocked: "Votre compte est déverrouillé. Connectez-vous pour continuer."
  errors:
    messages:
      already_confirmed: "a déjà été confirmé·e, essayez de vous connecter"
      confirmation_period_expired: "doit être confirmé·e dans un délai de %{period}, faites une nouvelle demande"
      expired: "a expiré, faites une nouvelle demande"
      not_found: "introuvable"
      not_locked: "n'était pas verrouillé"
      not_saved:
        one: "1 erreur a empêché l'enregistrement de ce %{resource} :"
        other: "%{count} erreurs ont empêché l'enregistrement de ce %{resource} :"
