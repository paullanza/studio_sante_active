# French is the app's language (config.i18n.default_locale = :fr). Missing
# keys fall back to English (config/locales/*.en.yml) until the old pages go.
fr:
  activerecord:
    errors:
      messages:
        record_invalid: "La validation a échoué : %{errors}"
        restrict_dependent_destroy:
          has_one: "Impossible de supprimer : un enregistrement %{record} dépendant existe."
          has_many: "Impossible de supprimer : des enregistrements %{record} dépendants existent."
    attributes:
      user:
        email: "Courriel"
        password: "Mot de passe"
        password_confirmation: "Confirmation du mot de passe"
        current_password: "Mot de passe actuel"
        remember_me: "Se souvenir de moi"
        first_name: "Prénom"
        last_name: "Nom"
        phone: "Téléphone"
        address: "Adresse"
        birthday: "Date de naissance"
        signup_code_token: "Code d'inscription"
      session:
        occurred_at: "Date et heure"
        fliip_user: "Client·e"
        fliip_user_id: "Client·e"
        fliip_service: "Service"
        fliip_service_id: "Service"
        user: "Entraîneur·e"
        duration: "Durée"
        note: "Note"
      consultation:
        first_name: "Prénom"
        last_name: "Nom"
        email: "Courriel"
        phone_number: "Téléphone"
        occurred_at: "Date et heure"
        user: "Entraîneur·e"
        user_id: "Entraîneur·e"
        note: "Note"
      service_definition:
        service_name: "Nom"
        paid_sessions: "Séances"
        free_sessions: "Absences"

  errors:
    format: "%{attribute} %{message}"
    messages:
      accepted: "doit être accepté·e"
      blank: "ne peut pas être vide"
      confirmation: "ne correspond pas à %{attribute}"
      empty: "ne peut pas être vide"
      equal_to: "doit être égal à %{count}"
      even: "doit être pair"
      exclusion: "n'est pas disponible"
      greater_than: "doit être supérieur à %{count}"
      greater_than_or_equal_to: "doit être supérieur ou égal à %{count}"
      in: "doit être compris entre %{count}"
      inclusion: "n'est pas inclus·e dans la liste"
      invalid: "est invalide"
      less_than: "doit être inférieur à %{count}"
      less_than_or_equal_to: "doit être inférieur ou égal à %{count}"
      model_invalid: "La validation a échoué : %{errors}"
      not_a_number: "n'est pas un nombre"
      not_an_integer: "doit être un nombre entier"
      odd: "doit être impair"
      other_than: "doit être différent de %{count}"
      present: "doit être vide"
      required: "doit exister"
      taken: "est déjà utilisé·e"
      too_long:
        one: "est trop long (1 caractère maximum)"
        other: "est trop long (%{count} caractères maximum)"
      too_short:
        one: "est trop court (1 caractère minimum)"
        other: "est trop court (%{count} caractères minimum)"
      wrong_length:
        one: "ne fait pas la bonne longueur (doit comporter 1 caractère)"
        other: "ne fait pas la bonne longueur (doit comporter %{count} caractères)"

  date:
    formats:
      default: "%d/%m/%Y"
      short: "%d/%m"
      long: "%-d %B %Y"
    day_names: [dimanche, lundi, mardi, mercredi, jeudi, vendredi, samedi]
    abbr_day_names: [dim., lun., mar., mer., jeu., ven., sam.]
    month_names: [~, janvier, février, mars, avril, mai, juin, juillet, août, septembre, octobre, novembre, décembre]
    abbr_month_names: [~, janv., févr., mars, avr., mai, juin, juil., août, sept., oct., nov., déc.]
    order:
      - :day
      - :month
      - :year

  time:
    formats:
      default: "%d/%m/%Y %H:%M"
      short: "%d/%m %H:%M"
      long: "%-d %B %Y %H:%M"
    am: "am"
    pm: "pm"

  datetime:
    distance_in_words:
      about_x_hours:
        one: "environ une heure"
        other: "environ %{count} heures"
      about_x_months:
        one: "environ un mois"
        other: "environ %{count} mois"
      about_x_years:
        one: "environ un an"
        other: "environ %{count} ans"
      almost_x_years:
        one: "presque un an"
        other: "presque %{count} ans"
      half_a_minute: "une demi-minute"
      less_than_x_minutes:
        one: "moins d'une minute"
        other: "moins de %{count} minutes"
      less_than_x_seconds:
        one: "moins d'une seconde"
        other: "moins de %{count} secondes"
      over_x_years:
        one: "plus d'un an"
        other: "plus de %{count} ans"
      x_days:
        one: "1 jour"
        other: "%{count} jours"
      x_minutes:
        one: "1 minute"
        other: "%{count} minutes"
      x_months:
        one: "1 mois"
        other: "%{count} mois"
      x_seconds:
        one: "1 seconde"
        other: "%{count} secondes"
      x_years:
        one: "1 an"
        other: "%{count} ans"

  support:
    array:
      words_connector: ", "
      two_words_connector: " et "
      last_word_connector: " et "
